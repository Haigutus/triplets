# Build-verify the embedded qlever SPARQL engine (triplets.sparql._qlever).
#
# Follows the repo's CI philosophy (see build-wheels.yml): pixi is a local-dev
# convenience only — CI uses the plain runner toolchain. Same setup_*.py
# scripts as local dev, deps from apt (ubuntu-24.04 ships boost 1.83 ≥ the
# 1.81 qlever needs), the heavy qlever compile (~40-60 min) cached on the
# vendor/qlever submodule SHA so subsequent runs only relink the extension
# and run the parity tests.
#
# Distribution wheels are a follow-up (TODO.md): the qlever compile can move
# into build-wheels.yml's cibuildwheel via CIBW_BEFORE_ALL once boost ≥ 1.81
# is built in the manylinux container (its repos ship ≤ 1.75); auditwheel
# then grafts the shared libs, making the wheel relocatable.
name: Build qlever engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "setup_qlever.py"
      - "setup_qlever_lib.py"
      - "triplets/sparql/_qlever*"
      - "triplets/sparql/sparql_qlever.py"
      - "tests/test_sparql_qlever.py"
      - ".gitmodules"
      - ".github/workflows/build-qlever.yml"

concurrency:
  group: qlever-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qlever:
    name: Compile qlever + extension + parity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        # no submodules: true — vendor/qlever is update=none; init exactly
        # what this job needs below

      - name: Init submodules (qlever sources + Svedala test data)
        run: |
          git submodule update --init --checkout vendor/qlever
          git submodule update --init test_data/relicapgrid

      - name: Install C++ dependencies (mirrors qlever's own CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-url-dev libboost-container-dev \
            libicu-dev libssl-dev libzstd-dev zlib1g-dev libbz2-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve qlever submodule SHA
        id: qlever-sha
        run: echo "sha=$(git rev-parse HEAD:vendor/qlever)" >> "$GITHUB_OUTPUT"

      - name: Cache qlever build
        uses: actions/cache@v5
        with:
          path: vendor/qlever/build-pic
          key: qlever-build-pic-${{ runner.os }}-24.04-${{ steps.qlever-sha.outputs.sha }}

      - name: Compile qlever (PIC static libraries, cached)
        run: python setup_qlever_lib.py

      - name: Install triplets + test dependencies
        run: |
          pip install cython setuptools
          pip install -e ".[validation,polars]" pytest

      - name: Build the triplets.sparql._qlever extension
        run: python setup_qlever.py build_ext --inplace

      - name: Run qlever engine parity tests
        run: pytest tests/test_sparql_qlever.py -q --tb=short
