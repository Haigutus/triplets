# pytest: pure-Python engines on every supported Python.
# pytest-compiled: the same suite with the cython extensions built (qlever stays
# a local pixi task — native build too heavy for CI).
# Performance benchmarks are deselected by default (pyproject addopts).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true          # test_data zips (RealGrid) are LFS objects

      - name: Fetch test data (only the data submodules — not vendor/qlever)
        run: git submodule update --init test_data/relicapgrid test_data/CGMES-AP

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with test extras
        run: pip install -e .[dev,validation,oxigraph,duckdb,excel,networkx]

      - name: Run tests
        run: pytest -n auto -q

  pytest-compiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Fetch test data and the pugixml source
        run: git submodule update --init test_data/relicapgrid test_data/CGMES-AP vendor/pugixml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install with test extras (builds the cython extensions)
        run: pip install -e .[dev,validation,oxigraph,duckdb,excel,networkx]

      - name: Run tests
        env:
          TRIPLETS_REQUIRE_COMPILED: "1"
        run: pytest -n auto -q -rs
