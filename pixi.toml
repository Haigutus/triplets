[workspace]
name = "triplets"
version = "0.1.0"
description = "RDF/XML toolkit for ENTSO-E/CGMES power grid data (parser focus)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
pandas = ">=2.0"
lxml = ">=4.9"

[feature.test.dependencies]
pytest = ">=7.0"
pytest-xdist = "*"

[feature.arrow.dependencies]
pyarrow = ">=14.0"

[feature.polars.dependencies]
polars = ">=1.0"
pyarrow = ">=14.0"

[feature.build.dependencies]
cython = ">=3.0"
setuptools = ">=61"
numpy = "*"  # for pyarrow numpy_interop headers in some builds
compilers = "*"
pyarrow = "*"

# C++ toolchain + deps for the embedded qlever SPARQL engine (setup_qlever.py).
# qlever itself is compiled once from a separate checkout (QLEVER_SRC_DIR)
# inside this environment, so all libraries share one ABI and pixi.lock pins
# them. python is pinned to the interpreter ABI the extension is used with.
[feature.qlever.dependencies]
python = ">=3.13,<3.14"
cmake = ">=3.28"
ninja = "*"
libboost-devel = ">=1.81"
icu = "*"
openssl = "*"
zstd = "*"
jemalloc = "*"

[feature.qlever.tasks]
# one-time: compile qlever with PIC (required for linking into a Python extension)
# -fno-semantic-interposition: gcc refuses always_inline under plain -fPIC
build-qlever-lib = { cmd = "cmake -S $QLEVER_SRC_DIR -B $QLEVER_SRC_DIR/build-pic -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS=-fno-semantic-interposition && cmake --build $QLEVER_SRC_DIR/build-pic --target qlever", env = { QLEVER_SRC_DIR = "../qlever" } }
# build the triplets.sparql._qlever extension against it
build-qlever = { cmd = "python setup_qlever.py build_ext --inplace", env = { QLEVER_SRC_DIR = "../qlever", QLEVER_BUILD_DIR = "../qlever/build-pic" } }

[environments]
default = { features = ["test"] }
arrow = { features = ["test", "arrow"] }
build = { features = ["build", "test", "arrow", "polars"] }
dev = { features = ["build", "test", "arrow", "polars"] }
qlever = { features = ["build", "test", "arrow", "polars", "qlever"] }

[tasks]
build-cython-pugixml-arrow = "python setup_cython_parser.py build_ext --inplace"
test = "pytest -q --tb=no"
test-parser = "pytest tests/test_parser_backends.py -q --tb=short"
sync-uv = "uv sync --dev"
