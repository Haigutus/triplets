[workspace]
name = "triplets"
version = "0.1.0"
description = "RDF/XML toolkit for ENTSO-E/CGMES power grid data (parser focus)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# pixi supplies only the native build toolchain. The extensions are compiled
# under the uv venv's python (`uv run --no-sync`), so they link the venv's
# pyarrow; tests run in the uv venv, never inside pixi. No conda pyarrow in
# any env: its libarrow on the conda -L/-rpath paths would be linked instead.
[feature.build.dependencies]
compilers = "*"

[feature.build.tasks]
build-cython-pugixml-arrow = "uv run --no-sync --with Cython --with setuptools python setup_cython_parser.py build_ext --inplace"

# C++ toolchain + deps for the embedded qlever SPARQL engine. qlever itself is
# compiled once from a separate checkout (QLEVER_SRC_DIR) inside this
# environment, so all C++ libraries share one ABI and pixi.lock pins them.
[feature.qlever.dependencies]
python = ">=3.11"  # runs setup_qlever_lib.py (cmake/ninja driver only)
compilers = "*"
cmake = ">=3.28"
ninja = "*"
libboost-devel = ">=1.81"
icu = "*"
openssl = "*"
zstd = "*"
zlib = "*"   # zlib + bzip2: -lz / -lbz2 in setup_qlever.py
bzip2 = "*"
jemalloc = "*"

[feature.qlever.tasks]
# source resolution ($QLEVER_SRC_DIR → vendor/qlever → ../qlever) lives in the scripts
build-qlever-lib = "python setup_qlever_lib.py"  # one-time qlever compile (PIC); cmake/ninja only
build-qlever = "uv run --no-sync --with Cython --with setuptools python setup_qlever.py build_ext --inplace"  # the triplets.sparql._qlever extension

[environments]
build = { features = ["build"] }
qlever = { features = ["qlever"] }
